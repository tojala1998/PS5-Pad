name: Prepare 0.4.13-based independent Power Off
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/prepare-poweroff.yml'
      - 'tools/prepare_poweroff_fix.py'
permissions:
  contents: write
jobs:
  prepare:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Restore actual .13 sources and apply power-only changes
        run: python3 tools/prepare_poweroff_fix.py
      - name: Run offline controller and power regression tests
        run: |
          set -euo pipefail
          make -C service check
          cc -std=c11 -Wall -Wextra -Werror app/test_poweroff.c -o /tmp/test-power-policy
          /tmp/test-power-policy
          cc -std=c11 -Wall -Wextra -Werror -DQP_POWER_TEST service/poweroff/main.c service/poweroff/test.c -o /tmp/test-power-api
          /tmp/test-power-api
      - name: Commit tested source directly to main without publishing
        run: |
          set -euo pipefail
          git add -- app service tools README.md docs/PS5-Pad-0.4.15-notes.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Restore .13 controller baseline; independent confirmed power off for 0.4.15 [skip ci]'
          git push origin HEAD:main
