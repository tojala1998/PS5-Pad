name: Native regression checks

on:
  push:
    branches:
      - fix/full-power-off-helper-2-8
  pull_request:

jobs:
  host-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Service host regression suite
        run: make -C service check
      - name: App policy and protocol regression suite
        run: |
          set -eu
          for test in test_loader test_protocol test_input_queue test_initialization test_lifecycle test_input_feedback test_discovery; do
            cc -std=c11 -D_POSIX_C_SOURCE=200809L -Wall -Wextra -Werror "app/$test.c" -o "/tmp/$test"
            "/tmp/$test"
          done
